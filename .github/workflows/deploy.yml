name: Build Android APK & Deploy Web Portal (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
      - feature/redesign-cauquen-ui
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Web Portal (GitHub Pages)
        run: |
          flutter build web --release --base-href "/CauquenCMMS/"
          cp build/app/outputs/flutter-apk/app-release.apk build/web/CauquenCMMS.apk
          cp build/web/index.html build/web/404.html

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CauquenCMMS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy Web Portal & APK to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true

